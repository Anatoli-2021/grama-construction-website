<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Development OS — workspace prototype</title>
<!--
  Workspace prototype: Daily Workspace, Design Studio, New Development Project.
  Ships with made-up sample data only. Everything a person adds (projects, tasks, files, selections)
  stays in that browser's local storage. Nothing is uploaded, sent or synchronised.
  AI, Smartsheet, Wave and email are NOT connected.
-->
<style>
:root{
  color-scheme:light;
  --page:#f5f5f7; --surface:#ffffff; --inset:#f5f5f7; --glass:rgba(250,250,252,.78);
  --ink:#1d1d1f; --ink-2:#515154; --muted:#86868b; --line:#e8e8ed; --line-2:#d2d2d7;
  --accent:#0066cc; --accent-fill:#0071e3; --on-accent:#fff; --hover:rgba(0,0,0,.05);
  --st-good:#0ca30c; --st-ready:#2a78d6; --st-over:#d03b3b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -20px rgba(0,0,0,.18);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0b0b0d; --surface:#1c1c1e; --inset:#2a2a2d; --glass:rgba(28,28,30,.78);
    --ink:#f5f5f7; --ink-2:#c7c7cc; --muted:#8e8e93; --line:#2c2c2e; --line-2:#3a3a3c;
    --accent:#4aa3ff; --accent-fill:#0a84ff; --hover:rgba(255,255,255,.07); --st-ready:#3987e5; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0b0b0d; --surface:#1c1c1e; --inset:#2a2a2d; --glass:rgba(28,28,30,.78);
  --ink:#f5f5f7; --ink-2:#c7c7cc; --muted:#8e8e93; --line:#2c2c2e; --line-2:#3a3a3c;
  --accent:#4aa3ff; --accent-fill:#0a84ff; --hover:rgba(255,255,255,.07); --st-ready:#3987e5; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.47 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;padding:22px 14px 18px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 4px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;border-radius:9px;background:none;color:var(--ink);font-size:14.5px;cursor:pointer;text-align:left;width:100%}
.nav button:hover,.plist button:hover{background:var(--hover)}
.nav svg{width:19px;height:19px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{background:var(--hover);font-weight:600}
.nav .n{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted)}
.cap{font-size:12px;color:var(--muted)}
.sub{font-size:13px;color:var(--ink-2)}
.side h3{font-size:11px;font-weight:500;color:var(--muted);padding:0 10px;margin-bottom:4px}
.plist{display:flex;flex-direction:column;gap:1px;max-height:32vh;overflow-y:auto;margin-top:6px}
.plist button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:9px;background:none;cursor:pointer;font-size:13.5px}
.plist button[aria-current="true"]{background:var(--hover);font-weight:600}
.plist small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.in{padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);min-width:0;width:100%}
textarea.in{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 15px;border:0;border-radius:980px;background:var(--accent-fill);color:var(--on-accent);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--inset);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px;font-size:12px;color:var(--muted)}
.ghost{padding:7px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink)}
.main{min-width:0;padding:0 clamp(16px,3.2vw,44px) 110px}
.wrap{max-width:1160px;margin:0 auto}
.topbar{display:none}
.notice{margin:18px 0 0;padding:11px 14px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;color:var(--ink-2)}
.notice b{color:var(--ink);font-weight:600}
.head{padding:28px 0 16px}
.head .crumb{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.head h1{font-size:clamp(26px,3vw,36px);font-weight:600;letter-spacing:-.028em;line-height:1.12}
.head p{color:var(--ink-2);margin-top:6px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:18px 22px 10px}
.card-h h2{font-size:17px;font-weight:600;letter-spacing:-.02em}
.card-b{padding:0 22px 20px}
.kpi{padding:16px 22px}
.kpi .lbl{font-size:13px;color:var(--ink-2)}
.kpi .val{font-size:36px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin:4px 0}
.kpi .val small{font-size:15px;font-weight:500;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-radius:980px;background:var(--inset);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:2px;box-shadow:inset 0 0 0 2px var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:var(--inset);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.tag.warn{background:transparent;box-shadow:inset 0 0 0 1px var(--st-over);color:var(--ink)}
.tag.ok{background:transparent;box-shadow:inset 0 0 0 1px var(--st-good);color:var(--ink)}
.segctl{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--line);max-width:100%;overflow-x:auto}
.segctl button{padding:7px 14px;border:0;border-radius:8px;background:none;cursor:pointer;color:var(--ink);font-size:13.5px;white-space:nowrap}
.segctl button[aria-selected="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.flow{display:grid;grid-template-columns:repeat(8,minmax(104px,1fr));gap:2px;overflow-x:auto;margin:4px 0 20px;padding-bottom:4px}
.flow button{display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding:10px 10px 11px;border:0;background:var(--surface);cursor:pointer;text-align:left;min-height:66px}
.flow button:first-child{border-radius:12px 0 0 12px}.flow button:last-child{border-radius:0 12px 12px 0}
.flow .k{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.flow .nm{font-size:12.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.flow .c{font-size:11px;color:var(--ink-2);margin-top:auto}
.flow button[aria-current="step"]{box-shadow:inset 0 -3px 0 var(--accent-fill)}
.rows{display:flex;flex-direction:column}
.row{padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.row .t{font-weight:600;letter-spacing:-.01em}
.row .d{font-size:13px;color:var(--ink-2);margin-top:2px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.steps{display:flex;gap:3px;margin-top:10px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--st-ready)} .steps i.ok{background:var(--st-good)}
.steplbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
.steplbl b{color:var(--ink);font-weight:600}
.hist{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--inset);font-size:12.5px;color:var(--ink-2)}
.empty{padding:16px 18px;border-radius:12px;color:var(--ink-2);font-size:13px;background:var(--inset)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;border:1.5px dashed var(--line-2);border-radius:14px;text-align:center;color:var(--ink-2);font-size:13px}
.drop.over{border-color:var(--accent-fill);background:var(--inset)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.file{border-radius:12px;background:var(--inset);overflow:hidden;font-size:12.5px;cursor:pointer;border:0;text-align:left;padding:0;color:inherit}
.th{height:92px;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.file .m{padding:8px 10px}
.file .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.board .th{height:96px;border-radius:10px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
.form label,.lab{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:left;padding:8px 14px 8px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:10px 14px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
.scroll{overflow-x:auto}
pre.brief{white-space:pre-wrap;font:13px/1.5 ui-monospace,"SF Mono",Consolas,monospace;background:var(--inset);padding:14px;border-radius:12px;margin:10px 0 0;max-height:320px;overflow:auto}
.chk{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:8px 12px;align-items:start}
.nine{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:10px}
.tabs{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)} .side{display:none}
  .side.open{display:flex;position:fixed;inset:0;z-index:40;height:auto;border-right:0;background:var(--page);padding-bottom:90px}
  .topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 calc(-1*clamp(16px,3.2vw,44px));padding:10px clamp(16px,3.2vw,44px);background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0} .topbar .brand svg{width:28px;height:28px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:10.5px;color:var(--muted);border:0;background:none;cursor:pointer}
  .tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .tabs button[aria-current="page"]{color:var(--accent)}
  .head{padding:22px 0 14px} .card-h,.card-b,.kpi{padding-left:18px;padding-right:18px}
  .form{grid-template-columns:minmax(0,1fr)} .kpi .val{font-size:30px} .chk{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="brand" id="brand"></div>
    <nav class="nav" id="nav"></nav>
    <div>
      <h3>Projects by address</h3>
      <input class="in" id="q" type="search" placeholder="Search address" autocomplete="off" aria-label="Search projects by address">
      <div class="plist" id="plist"></div>
    </div>
    <div class="side-foot">
      <span id="storage"></span>
      <button class="ghost" id="theme" type="button">Light / dark</button>
      <button class="ghost" id="reset" type="button">Reset prototype data</button>
      <span>Prototype v0.2 · nothing is connected</span>
    </div>
  </aside>
  <div class="main">
    <div class="topbar"><div class="brand" id="brand-m"></div><button class="ghost" data-act="menu" type="button">Projects</button></div>
    <div class="wrap">
      <div class="notice" role="note"><b>Prototype.</b> It opens with one made-up sample project. What you add stays in this browser on this device — nothing is uploaded or sent. AI, Smartsheet, Wave and email are not connected; exports are Draft files for you to review.</div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Main areas"></nav>
</div>

<script>
/* ============ constants ============ */
const STATUSES = ["Discussed","Selected","Approved","Ordered","Received","Paid","Installed"];
const FILE_CATS = ["Survey","Drawing","Photo","Reference","Specification","Rendering"];
const SEL_CATS = { // category -> proposed trade (a suggestion, never an assignment)
  "Cabinets":"Cabinet installer","Countertops":"Countertop fabricator","Tile":"Tile setter","Plumbing fixtures":"Plumber",
  "Lighting":"Electrician","Appliances":"Appliance installer","Paint":"Painter","Flooring":"Flooring installer",
  "Windows & doors":"Carpenter","Siding":"Siding installer","Roofing":"Roofer","Landscape":"Landscaper","Other":"To be assigned"
};
const DEFAULT_AREAS = ["Kitchen","Bathrooms","Exterior","Interior finishes","Site & landscape"];
const ROLES = ["Owner / approver","Project lead","Design lead","Estimator","Site lead","Office / admin"];
const FLOW = ["Project","Upload sources","Design","Review & approve","Takeoff & budget","Client proposal","Work package","Construction"];
const PROPOSAL_STATES = ["Not started","Drafted in Wave","Sent to client","Accepted by client"];
const TASK_KINDS = ["Task","Client request","Follow-up"];
// Development checklist: the task list of the existing blank launch template (launch-template.json), grouped for this view.
// [key, group, task, appliesTo, approval gate]
const LAUNCH_TASKS = [
 ["T01","Feasibility","Identify opportunity and check duplicates","All","PM intake approval"],
 ["T04","Feasibility","Test use, yield and program alternatives","All","Investment screening"],
 ["T05","Feasibility","Validate sales or rental basis","All","Market assumptions review"],
 ["T06","Feasibility","Build cost, cash and downside feasibility","All","Go / hold / reject"],
 ["T07","Partners","Agree entity, funding, roles and authority","All","Principal / partner approval"],
 ["T02","Legal documents","Verify title, legal description and acquisition terms","All","Acquisition decision by authorized principal"],
 ["T08","Legal documents","Coordinate and execute required agreements","All","Authorized signature"],
 ["T03","Architecture","Verify survey and site constraints","All","Professional scope approval"],
 ["T09","Architecture","Confirm zoning and entitlement path","All","Agency decisions and principal review"],
 ["S01","Architecture","Define shared infrastructure and lot release gates","Subdivision","Shared infrastructure / phasing approval"],
 ["T10","Architecture","Set design program and drawing control","All","Owner design review; professional responsibility"],
 ["T11","Architecture","Coordinate survey, civil, structural and MEP","All","Professional release for intended use"],
 ["T12","Permits","Track permits and review comments","All","Required agency approvals"],
 ["T13","Permits","Track each utility and offsite requirement","All","Provider / agency release; commitment approval"],
 ["T14","Budgets","Measure quantities and build cost-code estimate","All","Estimator quantity check"],
 ["T15","Budgets","Level bids and reconcile complete scope","All","Quote selection; no purchase implied"],
 ["S02","Budgets","Approve shared-cost allocation and portfolio elimination","Subdivision","Allocation-method approval"],
 ["T16","Budgets","Approve budget, contingency and funding baseline","All","Separate budget approval"],
 ["T22","Budgets","Reconcile incurred costs and cost-to-complete","All","Finance review; no posting or payment implied"],
 ["T23","Budgets","Review cash, funding and payment requests","All","Authorized payment / capital decisions"],
 ["T18","Schedules","Build master schedule and lookahead","All","Schedule baseline approval"],
 ["T19","Schedules","Verify release-to-build readiness","All","Human release-to-build"],
 ["T20","Schedules","Track progress, quality and inspections","All","Professional / agency inspections"],
 ["T21","Schedules","Control RFIs and cost / schedule changes","All","Change approval before commitment"],
 ["T17","Team responsibilities","Authorize contracts and purchase orders","All","Per-commitment authority"],
 ["T24","Closeout","Complete inspections, punch list and turnover","All","Agency / owner acceptance"],
 ["T25","Closeout","Close sale or lease and reconcile distributions","All","Commercial closing / distribution approval"],
 ["T26","Closeout","Assign warranty and security-release obligations","All","Warranty / agency closure"],
 ["T27","Closeout","Archive evidence and reusable cost lessons","All","Final archive verification"]
];
const GROUPS = ["Partners","Legal documents","Feasibility","Architecture","Permits","Budgets","Schedules","Team responsibilities","Closeout"];
const ICON = {
  daily:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  studio:'<path d="M4 17.5L15.5 6l2.5 2.5L6.5 20H4z"/><path d="M13.5 8l2.5 2.5M15 19h5"/>',
  "new":'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/>',
  higgsfield:'<rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 15.5l4.5-4 4 3.5 3-2.5 4.5 4"/><circle cx="15.5" cy="9.5" r="1.2"/>',
  menu:'<path d="M4 20V10l8-5.5 8 5.5v10"/><path d="M9.5 20v-6h5v6"/>'
};
const AREAS3 = [["daily","Daily Workspace"],["studio","Design Studio"],["new","New Development Project"],["higgsfield","Higgsfield designs"]];
const mark = id => '<svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3e44"/><stop offset="1" stop-color="#17181b"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#'+id+')"/><path d="M329.5 182.5A104 104 0 1 0 360 256" fill="none" stroke="#f5f5f7" stroke-width="38" stroke-linecap="round"/><path d="M360 256H266" fill="none" stroke="#c9a36b" stroke-width="38" stroke-linecap="round"/></svg>';

/* ============ storage: records in localStorage, file contents in IndexedDB; both fall back to memory ============ */
const KEY = "dev-os-design-studio-v1";
let persistent = true;
const Files = (() => {
  let db = null; const mem = new Map();
  const open = () => new Promise(res => { try {
      const r = indexedDB.open(KEY, 1);
      r.onupgradeneeded = () => r.result.createObjectStore("files");
      r.onsuccess = () => { db = r.result; res(true); };
      r.onerror = () => res(false);
    } catch (e) { res(false); } });
  const put = (id, blob) => new Promise(res => { mem.set(id, blob); if (!db) return res();
      try { const t = db.transaction("files","readwrite"); t.objectStore("files").put(blob, id); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } });
  const get = id => new Promise(res => { if (mem.has(id)) return res(mem.get(id)); if (!db) return res(null);
      try { const r = db.transaction("files").objectStore("files").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } });
  const clear = () => new Promise(res => { mem.clear(); if (!db) return res();
      try { const t = db.transaction("files","readwrite"); t.objectStore("files").clear(); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } });
  return { open, put, get, clear, ok: () => !!db };
})();
function loadState(){ try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { persistent = false; return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { persistent = false; } }

/* ============ helpers ============ */
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => { const t = String(v == null ? "" : v).trim(); return t !== "" && isFinite(+t) ? +t : null; };
const money = n => "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2 });
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const today = () => iso(new Date());

function blockers(p){
  const out = [];
  for (const s of approved(p)) {
    if (s.qty == null) out.push(s.name + ": approved without a quantity");
    if (!s.spec) out.push(s.name + ": approved without a specification or model");
    if (!s.costCode) out.push(s.name + ": no cost code, cannot map to the budget");
  }
  for (const a of p.areas) if (p.selections.some(s => s.areaId === a.id && idx(s) >= 1) && !p.files.some(f => f.areaId === a.id && f.cat === "Drawing")) out.push(a.name + ": selections exist but no drawing is uploaded");
  return out;
}
function deadlines(){ // tasks and selections with a date, across all projects
  const t = today(), list = [];
  for (const k of state.tasks) if (k.due && !k.done) list.push({ date: k.due, what: k.text, where: (proj(k.projectId) || {}).address || "No project", confirmed: k.confirmed, kind: k.kind });
  for (const p of state.projects) for (const s of p.selections) if (s.neededBy && idx(s) < 6) list.push({ date: s.neededBy, what: s.name + " — " + s.status, where: p.address, confirmed: s.neededConfirmed, kind: "Selection" });
  return list.sort((a, b) => a.date.localeCompare(b.date)).map(d => Object.assign(d, { late: d.date < t }));
}

async function importHiggsfield({ projectId, areaId, optionId, files, link, prompt }){

  const area = p.areas.find(a => a.id === areaId) || p.areas[0], o = optionId && p.options.find(x => x.id === optionId);
  for (const f of files) { const id = uid(), same = p.files.filter(x => x.areaId === area.id && x.name === f.name);

    p.files.push({ id, areaId: area.id, name: f.name, cat: "Rendering", source: "Higgsfield", link: link || "", prompt: prompt || "", size: f.size, type: f.type || "", added: today(), rev: same.length + 1 });

  if (act === "dash") { location.href = DASHBOARD; return; }
  if (act === "view") { state.view = t.dataset.v; ui.editing = null; $("#side").classList.remove("open"); scrollTo(0, 0); }
  else if (act === "goto") { state.current = id; state.view = "studio"; ui.editing = null; if (t.dataset.n) proj(id).step = +t.dataset.n; $("#side").classList.remove("open"); scrollTo(0, 0); }
  else if (act === "step") { p.step = +t.dataset.n; ui.editing = null; }
  else if (act === "area") { p.areaId = id; ui.editing = null; }
  else if (act === "out") state.out = t.dataset.v;
  else if (act === "filter") state.filter = t.dataset.v;
  else if (act === "task-done") { const k = state.tasks.find(x => x.id === id); if (k) { k.done = true; k.doneOn = today(); } }
  else if (act === "next" && s) { const i = idx(s); if (i < 6) { s.status = STATUSES[i + 1]; if (i === 1) s.approvedOn = today(); } }
  else if (act === "edit" && s) { ui.editing = s.id; p.areaId = s.areaId; p.step = 3; save(); render(); const c = $("#selcard"); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  else if (act === "cancel") ui.editing = null;
  else if (act === "hist") ui.hist[id] = !ui.hist[id];
  else if (act === "opt-review" && o) o.status = "In review";
  else if (act === "opt-approve" && o) { o.status = "Approved"; o.approvedOn = today(); }
  else if (act === "opt-changes" && o) o.status = "Changes requested";
  else if (act === "opt-revise" && o) { optHist(o); o.rev++; o.status = "Draft"; o.comment = ""; }
  else if (act === "opt-attach" && o) { const sel = document.querySelector(`[data-pick="${id}"]`); if (sel && sel.value) o.fileIds.push(sel.value); }
  else if (act === "open") { const b = await Files.get(id); if (b) window.open(URL.createObjectURL(b), "_blank"); return; }
  else if (act === "brief" || act === "copy") { const el = $("#brief"); el.textContent = brief(p, p.areaId); el.hidden = false;
    if (act === "copy") { try { await navigator.clipboard.writeText(el.textContent); $("#copied").textContent = "Copied."; } catch (x) { $("#copied").textContent = "Select the text to copy it."; } } return; }
  else if (act === "dl") { const k = t.dataset.k, slug = p.address.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") || "project";
    if (k === "tasks") download(`${slug}-draft-tasks.json`, taskJson(p), "application/json"); else download(`${slug}-${k}.csv`, csv([OUT[k][1], ...outRows(p, k)]), "text/csv"); return; }
  save(); render();
});
document.addEventListener("submit", e => {
  e.preventDefault(); const p = P(), f = e.target.id;
  if (f === "hgform") { const files = [...$("#hg_in").files];
    importHiggsfield({ projectId: $("#hg_proj").value, areaId: $("#hg_area").value, optionId: $("#hg_opt").value, files, link: $("#hg_link").value.trim(), prompt: $("#hg_prompt").value.trim() }).then(err => { if (err) $("#hg_err").textContent = err; else render(); });
    return; }
  if (f === "newdev") { const addr = $("#n_addr").value.trim(); if (!addr) { $("#n_err").textContent = "An address is required."; $("#n_addr").focus(); return; }
    if (state.projects.some(x => x.address.toLowerCase() === addr.toLowerCase())) { $("#n_err").textContent = "A project with this address already exists."; return; }
    const np = newProject(addr, $("#n_type").value, { client: $("#n_client").value.trim(), source: $("#n_src").value.trim(), description: $("#n_desc").value.trim() });
    state.projects.push(np); state.current = np.id; state.view = "studio"; }
  else if (f === "newtask") { const text = $("#t_text").value.trim(); if (!text) { $("#t_text").focus(); return; }
    state.tasks.push({ id: uid(), kind: $("#t_kind").value, text, projectId: $("#t_proj").value || null, due: $("#t_due").value, confirmed: !!$("#t_conf").value, done: false }); }
  else if (f === "addarea") { const n = $("#a_name").value.trim(); if (!n) return; const id = uid(); p.areas.push({ id, name: n }); p.areaId = id; }
  else if (f === "optform") { const n = $("#o_name").value.trim(); if (!n) { $("#o_name").focus(); return; }
    p.options.push({ id: uid(), areaId: p.areaId, name: n, desc: $("#o_desc").value.trim(), fileIds: [], status: "Draft", rev: 1, history: [], comment: "" }); }
  else if (f === "selform") { const name = $("#s_name").value.trim(); if (!name) { $("#s_name").focus(); return; }
    const data = { name, category: $("#s_cat").value, vendor: $("#s_vendor").value.trim(), spec: $("#s_spec").value.trim(), qty: num($("#s_qty").value), unit: $("#s_unit").value.trim(), unitCost: num($("#s_cost").value), costCode: $("#s_code").value.trim(), neededBy: $("#s_need").value, neededConfirmed: !!$("#s_conf").value };
    const cur = ui.editing && p.selections.find(s => s.id === ui.editing);
    if (cur) { if (idx(cur) >= 2) { cur.history.push({ rev: cur.rev, status: cur.status, when: today(), spec: cur.spec, vendor: cur.vendor, qty: cur.qty, unit: cur.unit }); cur.rev++; cur.status = "Selected"; }
      Object.assign(cur, data); ui.editing = null; }
    else p.selections.push(Object.assign({ id: uid(), areaId: p.areaId, leadDays: null, status: "Discussed", rev: 1, history: [] }, data)); }
  save(); render();
});
document.addEventListener("input", e => {
  const t = e.target, p = P();
  if (t.id === "q") { ui.q = t.value; render(); const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); return; }
  if (t.id === "notes") p.notes[p.areaId] = t.value;
  else if (t.id === "p_client") p.client = t.value;
  else if (t.id === "pr_no") p.proposal.waveNo = t.value.trim();
  else if (t.dataset.team != null) p.team[+t.dataset.team].name = t.value;
  else if (t.dataset.ev) { const c = p.checklist.find(x => x.key === t.dataset.ev); if (c) c.evidence = t.value; }
  else if (t.dataset.oc) { const o = p.options.find(x => x.id === t.dataset.oc); if (o) o.comment = t.value; }
  else return;
  save();
});
document.addEventListener("change", e => {
  const t = e.target, p = P();
  if (t.id === "f_in" && t.files.length) { addFiles([...t.files]); return; }
  if (t.dataset.chk) { const c = p.checklist.find(x => x.key === t.dataset.chk); if (c) c.status = t.value; }
  else if (t.id === "pr_state") p.proposal.state = t.value;
  else if (t.id === "hg_proj") { ui.hgProj = t.value; ui.hgArea = null; }
  else if (t.id === "hg_area") ui.hgArea = t.value;
  else return;
  save(); render();
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); } });
$("#theme").addEventListener("click", () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; });
$("#reset").addEventListener("click", async () => { if (!confirm("Remove everything added in this prototype on this device and restore the made-up sample?")) return; await Files.clear(); thumbs.clear(); state = sampleState(); ui = { q: "", editing: null, hist: {} }; save(); render(); });

/* Optional link back to a dashboard page: ?dashboard=<relative .html path>. Only a plain relative path is accepted. */
const DASHBOARD = (() => { try { const d = new URLSearchParams(location.search).get("dashboard"); return d && /^[A-Za-z0-9 ._()\/-]+\.html$/.test(d) && !d.includes("//") ? d : null; } catch (e) { return null; } })();

(async () => {
  await Files.open();
  const saved = loadState();
  state = saved && saved.projects && saved.projects.length ? upgrade(saved) : sampleState();
  const h = (location.hash || "").slice(1), m = h.match(/^studio-([1-8])$/);          // deep links: #daily, #new, #studio, #studio-4
  if (m) { state.view = "studio"; P().step = +m[1]; } else if (["daily","studio","new","higgsfield"].includes(h)) state.view = h;
  $("#brand").innerHTML = mark("g1") + "<div><b>Grama OS</b><span>Development OS</span></div>";
  $("#brand-m").innerHTML = mark("g2") + "<div><b>Grama OS</b><span>Development OS</span></div>";
  save(); render();
})();
</script>
</body>
</html>
